services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?define POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?define POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?replace the example password in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [latent]

  app:
    build:
      context: ./servidor-pareja
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PUERTO: "8081"
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      CLAVE_FIRMA: ${CLAVE_FIRMA:?replace the example signing secret in .env}
      MODO_DEMO: ${MODO_DEMO:-false}
      ANFITRION_USUARIO: ${ANFITRION_USUARIO:-}
      ANFITRION_CLAVE: ${ANFITRION_CLAVE:-}
    ports:
      - "${PUERTO_PUBLICO:-8081}:8081"
    networks: [latent]

volumes:
  postgres_data:

networks:
  latent:
    driver: bridge
